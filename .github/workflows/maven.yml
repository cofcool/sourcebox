name: Maven Build and Release

on:
  push:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Build package
        run: mvn clean package

      - name: Set up JDK for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TheSourceBox
          path: android/app/build/outputs/apk/debug/TheSourceBox-debug.apk
          if-no-files-found: error

      - name: Create and push hourly tag
        id: tag
        shell: bash
        run: |
          tag="$(date -u +'%Y%m%d%H')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Create release and upload artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" target/sourcebox-bin.zip android/app/build/outputs/apk/debug/TheSourceBox-debug.apk --title "$TAG" --notes-file ./target/changelog-runWithLatest.md
