[package]
name = "thesourcebox"
version = "0.1.0"
description = "TheSourceBox desktop application"
authors = ["cofcool"]
edition = "2021"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.8.0" }
tauri-plugin-shell = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
